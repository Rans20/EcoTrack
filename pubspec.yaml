name: footprynt
description: Track your CO2. Tread lighter.
version: 1.0.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.12.4
  google_maps_flutter: ^2.5.3
  location: ^5.0.3
  fl_chart: ^0.66.0
  intl: ^0.19.0
  provider: ^6.1.1
  google_sign_in: ^6.2.1
  image_picker: ^1.0.7
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"
  adaptive_icon_background: "#F1F5F2"
  adaptive_icon_foreground: "assets/logo/logo.png"


flutter:
  uses-material-design: true
  assets:
    - assets/logo/logo.png
